<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Напоминания — Apple Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#F2F2F7;--card:#FFFFFF;--text:#000000;--text2:#3C3C43;--text3:#8E8E93;
--sep:#C6C6C8;--blue:#007AFF;--red:#FF3B30;--orange:#FF9500;--green:#34C759;
--purple:#AF52DE;--tabbar:#F9F9F9;--search-bg:#E5E5EA;--nav-bg:rgba(249,249,249,0.94);
--card-radius:10px;--section-radius:10px;
}
.dark{
--bg:#000000;--card:#1C1C1E;--text:#FFFFFF;--text2:#EBEBF5;--text3:#8E8E93;
--sep:#38383A;--tabbar:#1C1C1E;--search-bg:#2C2C2E;--nav-bg:rgba(28,28,30,0.94);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}

.device{width:375px;height:812px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}

/* Status bar */
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:15px;font-weight:600;position:absolute;top:0;left:0;right:0;z-index:100;background:transparent}
.status-bar .time{font-weight:600}
.status-bar .icons{display:flex;gap:5px;font-size:12px}

/* Tab Bar */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:83px;background:var(--tabbar);border-top:0.5px solid var(--sep);display:flex;justify-content:space-around;align-items:flex-start;padding-top:6px;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-user-select:none;user-select:none;padding:2px 12px}
.tab-item .tab-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:20px}
.tab-item .tab-icon svg{width:24px;height:24px;fill:currentColor}
.tab-item .tab-label{font-size:10px;font-weight:500}
.tab-item{color:var(--text3)}
.tab-item.active{color:var(--blue)}

/* Screens */
.screen{position:absolute;top:0;left:0;right:0;bottom:83px;overflow:hidden;display:none;flex-direction:column}
.screen.active{display:flex}

/* Navbar */
.navbar{position:sticky;top:0;z-index:50;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid transparent;transition:border-color 0.2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navbar-title{font-size:17px;font-weight:600;opacity:0;transition:opacity 0.2s}
.navbar.scrolled .navbar-title{opacity:1}
.navbar .back-btn{position:absolute;left:8px;display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;cursor:pointer;padding:8px}
.navbar .back-btn::before{content:"";display:inline-block;width:10px;height:10px;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);margin-right:2px}

/* Scroll area */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:44px}

/* Large Title */
.large-title{font-size:34px;font-weight:700;letter-spacing:0.4px;padding:4px 20px 8px;color:var(--text)}

/* Summary Cards */
.summary-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
.summary-card{background:var(--card);border-radius:12px;padding:12px;cursor:pointer;position:relative}
.summary-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.summary-card-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600}
.summary-card-count{font-size:28px;font-weight:700;color:var(--text)}
.summary-card-label{font-size:13px;font-weight:500;color:var(--text3)}
.sc-all .summary-card-icon{background:var(--text3)}
.sc-today .summary-card-icon{background:var(--blue)}
.sc-planned .summary-card-icon{background:var(--red)}
.sc-flagged .summary-card-icon{background:var(--orange)}

/* Section */
.section{margin:0 20px 20px;background:var(--card);border-radius:var(--section-radius);overflow:hidden}
.section-header{font-size:22px;font-weight:700;padding:20px 20px 8px;color:var(--text)}

/* Task Row */
.task-row{display:flex;align-items:center;min-height:44px;padding:8px 16px;position:relative;cursor:pointer;overflow:hidden}
.task-row:not(:last-child)::after{content:"";position:absolute;bottom:0;left:52px;right:0;height:0.5px;background:var(--sep)}
.task-row .swipe-bg{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;z-index:1;overflow:hidden}
.task-row .swipe-bg span{color:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.task-row .task-content{display:flex;align-items:center;flex:1;z-index:2;background:var(--card);transition:transform 0.2s}
.checkbox{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--text3);margin-right:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s}
.checkbox.checked{background:var(--blue);border-color:var(--blue)}
.checkbox.checked::after{content:"";display:block;width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-info{flex:1;min-width:0}
.task-title{font-size:17px;color:var(--text);line-height:1.3}
.task-title.completed{text-decoration:line-through;color:var(--text3)}
.task-subtitle{font-size:14px;color:var(--text3);line-height:1.3}
.task-flag{color:var(--orange);margin-left:8px;font-size:14px}
.task-date{font-size:14px;color:var(--blue);margin-top:1px}

/* New Reminder */
.new-reminder-bar{display:flex;align-items:center;padding:12px 16px;cursor:pointer}
.new-reminder-bar .plus{color:var(--blue);font-size:20px;font-weight:300;margin-right:8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.new-reminder-bar span{color:var(--blue);font-size:17px}

/* Inline Add */
.inline-add{display:none;padding:8px 16px;border-top:0.5px solid var(--sep)}
.inline-add.visible{display:block}
.inline-add input{width:100%;font-size:17px;border:none;outline:none;background:transparent;color:var(--text);font-family:inherit;padding:8px 0}
.inline-add-toolbar{display:flex;gap:20px;padding:6px 0}
.inline-add-toolbar button{background:none;border:none;color:var(--blue);font-size:18px;cursor:pointer;padding:4px}

/* Lists Screen */
.lists-header{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;padding:24px 20px 8px}
.list-row{display:flex;align-items:center;min-height:44px;padding:10px 16px;position:relative;cursor:pointer}
.list-row:not(:last-child)::after{content:"";position:absolute;bottom:0;left:52px;right:0;height:0.5px;background:var(--sep)}
.list-circle{width:30px;height:30px;border-radius:50%;margin-right:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.list-name{flex:1;font-size:17px;color:var(--text)}
.list-count{font-size:17px;color:var(--text3);margin-right:6px}
.list-chevron{color:var(--text3);font-size:14px;font-weight:300}
.new-list-btn{display:flex;align-items:center;padding:16px 20px;cursor:pointer}
.new-list-btn span{color:var(--blue);font-size:17px;font-weight:500}

/* Search */
.search-container{padding:8px 16px}
.search-bar{display:flex;align-items:center;background:var(--search-bg);border-radius:10px;padding:8px 10px;gap:6px}
.search-bar svg{width:16px;height:16px;fill:var(--text3);flex-shrink:0}
.search-bar input{flex:1;border:none;outline:none;background:transparent;font-size:17px;color:var(--text);font-family:inherit}
.search-bar input::placeholder{color:var(--text3)}
.search-cancel{color:var(--blue);font-size:17px;cursor:pointer;padding:0 4px;display:none}
.search-cancel.visible{display:block}
.search-results{padding:8px 0}

/* Drill-down view */
.drill-view{position:absolute;top:0;left:0;right:0;bottom:83px;background:var(--bg);z-index:80;transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.25,0.1,0.25,1);display:flex;flex-direction:column}
.drill-view.visible{transform:translateX(0)}
.drill-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:10px}

/* Dark mode toggle */
.dark-toggle{position:absolute;top:50px;right:12px;z-index:200;width:32px;height:32px;border-radius:50%;background:var(--card);border:0.5px solid var(--sep);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}

/* Animations */
@keyframes checkAnim{0%{transform:scale(0.8)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.checkbox.checking{animation:checkAnim 0.3s ease}

/* Toast */
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:10px;padding:10px 20px;font-size:15px;color:var(--text);box-shadow:0 2px 20px rgba(0,0,0,0.15);z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<script>
// ===== DATA =====
const lists = [
  {id:'personal',name:'Личное',color:'#007AFF',icon:'●'},
  {id:'work',name:'Работа',color:'#34C759',icon:'●'},
  {id:'study',name:'Учёба',color:'#FF9500',icon:'●'}
];

let tasks = [
  {id:1,title:'Купить продукты',subtitle:'Молоко, хлеб, яйца',list:'personal',today:true,flagged:false,date:'Сегодня',done:false},
  {id:2,title:'Позвонить маме',subtitle:'',list:'personal',today:true,flagged:true,date:'Сегодня',done:false},
  {id:3,title:'Оплатить счета',subtitle:'Интернет и электричество',list:'personal',today:false,flagged:false,date:'Завтра',done:false},
  {id:4,title:'Подготовить презентацию',subtitle:'Для встречи в понедельник',list:'work',today:true,flagged:false,date:'Сегодня',done:false},
  {id:5,title:'Отправить отчёт',subtitle:'Квартальный отчёт Q1',list:'work',today:false,flagged:true,date:'20 марта',done:false},
  {id:6,title:'Код-ревью PR #42',subtitle:'Фронтенд рефакторинг',list:'work',today:false,flagged:false,date:'21 марта',done:false},
  {id:7,title:'Сдать домашнее задание',subtitle:'Математический анализ',list:'study',today:false,flagged:false,date:'22 марта',done:false},
  {id:8,title:'Прочитать главу 5',subtitle:'Алгоритмы и структуры данных',list:'study',today:false,flagged:false,date:'23 марта',done:false},
  {id:9,title:'Записаться к врачу',subtitle:'',list:'personal',today:false,flagged:false,date:'25 марта',done:false},
  {id:10,title:'Забрать посылку',subtitle:'Пункт выдачи на Ленина 10',list:'personal',today:false,flagged:false,date:'19 марта',done:false}
];

let nextId = 11;
let currentDrillList = null;

// ===== RENDER =====
function renderAll(){
  renderTodayTasks();
  renderAllTasks();
  renderLists();
  updateCounts();
}

function createTaskRow(task){
  const row = document.createElement('div');
  row.className = 'task-row';
  row.dataset.id = task.id;

  // Swipe background
  const swipeBg = document.createElement('div');
  swipeBg.className = 'swipe-bg';
  swipeBg.innerHTML = '<span>Удалить</span>';

  // Task content
  const content = document.createElement('div');
  content.className = 'task-content';

  const cb = document.createElement('div');
  cb.className = 'checkbox' + (task.done ? ' checked' : '');
  cb.onclick = (e) => { e.stopPropagation(); toggleTask(task.id, cb); };

  const info = document.createElement('div');
  info.className = 'task-info';

  const title = document.createElement('div');
  title.className = 'task-title' + (task.done ? ' completed' : '');
  title.textContent = task.title;
  info.appendChild(title);

  if(task.subtitle){
    const sub = document.createElement('div');
    sub.className = 'task-subtitle';
    sub.textContent = task.subtitle;
    info.appendChild(sub);
  }
  if(task.date){
    const dt = document.createElement('div');
    dt.className = 'task-date';
    dt.textContent = task.date;
    info.appendChild(dt);
  }

  content.appendChild(cb);
  content.appendChild(info);

  if(task.flagged){
    const flag = document.createElement('div');
    flag.className = 'task-flag';
    flag.textContent = '⚑';
    content.appendChild(flag);
  }

  row.appendChild(swipeBg);
  row.appendChild(content);

  // Swipe
  let startX = 0, currentX = 0, swiping = false;
  content.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    swiping = true;
    content.style.transition = 'none';
    swipeBg.style.transition = 'none';
  });
  content.addEventListener('touchmove', e => {
    if(!swiping) return;
    currentX = e.touches[0].clientX;
    const dx = Math.min(0, currentX - startX);
    if(dx < -10){
      content.style.transform = `translateX(${dx}px)`;
      swipeBg.style.width = `${Math.abs(dx)}px`;
    }
  });
  content.addEventListener('touchend', () => {
    swiping = false;
    content.style.transition = 'transform 0.3s';
    swipeBg.style.transition = 'width 0.3s';
    const dx = currentX - startX;
    if(dx < -80){
      deleteTask(task.id);
    } else {
      content.style.transform = 'translateX(0)';
      swipeBg.style.width = '0';
    }
  });

  // Mouse swipe fallback
  let mouseDown = false;
  content.addEventListener('mousedown', e => { startX = e.clientX; mouseDown = true; content.style.transition='none'; swipeBg.style.transition='none'; });
  content.addEventListener('mousemove', e => {
    if(!mouseDown) return;
    currentX = e.clientX;
    const dx = Math.min(0, currentX - startX);
    if(dx < -10){ content.style.transform=`translateX(${dx}px)`; swipeBg.style.width=`${Math.abs(dx)}px`; }
  });
  content.addEventListener('mouseup', () => {
    mouseDown = false;
    content.style.transition='transform 0.3s'; swipeBg.style.transition='width 0.3s';
    const dx = currentX - startX;
    if(dx < -80){ deleteTask(task.id); } else { content.style.transform='translateX(0)'; swipeBg.style.width='0'; }
  });
  content.addEventListener('mouseleave', () => {
    if(mouseDown){ mouseDown=false; content.style.transition='transform 0.3s'; swipeBg.style.transition='width 0.3s'; content.style.transform='translateX(0)'; swipeBg.style.width='0'; }
  });

  return row;
}

function renderTodayTasks(){
  const container = document.getElementById('today-tasks');
  container.innerHTML = '';
  const todayTasks = tasks.filter(t => t.today && !t.done);
  todayTasks.forEach(t => container.appendChild(createTaskRow(t)));
  if(!todayTasks.length) container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:15px">Нет задач на сегодня</div>';
}

function renderAllTasks(){
  const container = document.getElementById('all-tasks');
  container.innerHTML = '';
  const activeTasks = tasks.filter(t => !t.done);
  activeTasks.forEach(t => container.appendChild(createTaskRow(t)));
  if(!activeTasks.length) container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:15px">Нет задач</div>';
}

function renderLists(){
  const container = document.getElementById('lists-section');
  container.innerHTML = '';
  lists.forEach(list => {
    const count = tasks.filter(t => t.list === list.id && !t.done).length;
    const row = document.createElement('div');
    row.className = 'list-row';
    row.onclick = () => openDrill(list);
    row.innerHTML = `
      <div class="list-circle" style="background:${list.color}">${list.icon}</div>
      <div class="list-name">${list.name}</div>
      <div class="list-count">${count}</div>
      <div class="list-chevron">›</div>
    `;
    container.appendChild(row);
  });
}

function renderDrill(list){
  const container = document.getElementById('drill-tasks');
  container.innerHTML = '';
  document.getElementById('drill-title').textContent = list.name;
  const listTasks = tasks.filter(t => t.list === list.id && !t.done);
  listTasks.forEach(t => container.appendChild(createTaskRow(t)));
  if(!listTasks.length) container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:15px">Нет напоминаний</div>';
}

function updateCounts(){
  document.getElementById('count-all').textContent = tasks.filter(t => !t.done).length;
  document.getElementById('count-today').textContent = tasks.filter(t => t.today && !t.done).length;
  document.getElementById('count-planned').textContent = tasks.filter(t => t.date && !t.done).length;
  document.getElementById('count-flagged').textContent = tasks.filter(t => t.flagged && !t.done).length;
}

// ===== ACTIONS =====
function toggleTask(id, cbEl){
  const task = tasks.find(t => t.id === id);
  if(!task) return;
  task.done = !task.done;
  cbEl.classList.add('checking');
  cbEl.classList.toggle('checked', task.done);
  const titleEl = cbEl.parentElement.querySelector('.task-title');
  if(titleEl) titleEl.classList.toggle('completed', task.done);
  setTimeout(() => {
    cbEl.classList.remove('checking');
    if(task.done){
      setTimeout(() => renderAll(), 400);
      if(currentDrillList) renderDrill(currentDrillList);
    }
  }, 300);
}

function deleteTask(id){
  tasks = tasks.filter(t => t.id !== id);
  showToast('Удалено');
  renderAll();
  if(currentDrillList) renderDrill(currentDrillList);
}

function showInlineAdd(which){
  const el = document.getElementById('inline-' + which);
  el.classList.toggle('visible');
  if(el.classList.contains('visible')){
    el.querySelector('input').focus();
  }
}

function addTask(which, input){
  const text = input.value.trim();
  if(!text) return;

  let listId = 'personal';
  let isToday = false;

  if(which === 'today'){
    isToday = true;
  } else if(which === 'drill' && currentDrillList){
    listId = currentDrillList.id;
  }

  tasks.push({
    id: nextId++,
    title: text,
    subtitle: '',
    list: listId,
    today: isToday,
    flagged: false,
    date: isToday ? 'Сегодня' : '',
    done: false
  });

  input.value = '';
  showToast('Добавлено');
  renderAll();
  if(currentDrillList) renderDrill(currentDrillList);
}

// ===== NAVIGATION =====
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  closeDrill();
}

function openDrill(list){
  currentDrillList = list;
  renderDrill(list);
  document.getElementById('drill-view').classList.add('visible');
}

function closeDrill(){
  document.getElementById('drill-view').classList.remove('visible');
  currentDrillList = null;
}

function createNewList(){
  const name = prompt('Название нового списка:');
  if(!name) return;
  const colors = ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FF2D55','#5AC8FA'];
  lists.push({
    id: name.toLowerCase().replace(/\s/g,'_'),
    name: name,
    color: colors[lists.length % colors.length],
    icon: '●'
  });
  renderAll();
  showToast('Список создан');
}

// ===== SEARCH =====
function doSearch(query){
  const container = document.getElementById('search-results');
  container.innerHTML = '';
  if(!query.trim()){
    container.innerHTML = '';
    return;
  }
  const q = query.toLowerCase();
  const results = tasks.filter(t => !t.done && (t.title.toLowerCase().includes(q) || t.subtitle.toLowerCase().includes(q)));
  if(results.length){
    const section = document.createElement('div');
    section.className = 'section';
    section.style.margin = '0 20px';
    results.forEach(t => section.appendChild(createTaskRow(t)));
    container.appendChild(section);
  } else {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3);font-size:15px">Ничего не найдено</div>';
  }
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  document.getElementById('search-results').innerHTML = '';
}

// ===== SCROLL / LARGE TITLE =====
function setupScroll(screenId, navId, ltId){
  const scroll = document.querySelector(`#${screenId} .scroll-area`);
  const nav = document.getElementById(navId);
  const lt = document.getElementById(ltId);
  if(!scroll || !nav || !lt) return;

  scroll.addEventListener('scroll', () => {
    const scrollY = scroll.scrollTop;
    if(scrollY > 20){
      nav.classList.add('scrolled');
      const scale = Math.max(0.6, 1 - (scrollY - 20) / 100);
      const opacity = Math.max(0, 1 - (scrollY - 20) / 60);
      lt.style.transform = `scale(${scale})`;
      lt.style.transformOrigin = 'left center';
      lt.style.opacity = opacity;
    } else {
      nav.classList.remove('scrolled');
      lt.style.transform = 'scale(1)';
      lt.style.opacity = '1';
    }
  });
}

// ===== DARK MODE =====
function toggleDark(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
}

// ===== TOAST =====
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ===== INIT =====
renderAll();
setupScroll('screen-today','nav-today','lt-today');
setupScroll('screen-all','nav-all','lt-all');
setupScroll('screen-lists','nav-lists','lt-lists');
setupScroll('screen-search','nav-search','lt-search');
</script>
